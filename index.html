<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bill & Carl are getting married</title>
<meta name="description" content="Join us March 24, 2028 in Cancun, Mexico. Details coming soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF2F3;
  --pine:#415d65;       /* slate teal */
  --plum:#5c3b41;       /* deep wine accent */
  --blush:#E4D8DA;
  --mist:#C8D3D6;
  --display:"Bodoni Moda","Didot",Georgia,serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--pine);font:400 1.0625rem/1.65 var(--body)}
a{color:var(--plum)}
:focus-visible{outline:3px solid var(--plum);outline-offset:3px;border-radius:2px}
.wrap{max-width:62rem;margin:0 auto;padding:0 1.5rem}

/* nav */
nav{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--mist)}
nav .wrap{display:flex;gap:1.5rem;justify-content:center;flex-wrap:wrap;padding-top:.8rem;padding-bottom:.8rem}
nav a{color:var(--pine);text-decoration:none;font-weight:500;font-size:.95rem}
nav a:hover{color:var(--plum);text-decoration:underline;text-underline-offset:4px}

/* hero: the memorable thing */
.hero{background:var(--pine);color:var(--paper);min-height:100vh;display:flex;flex-direction:column;text-align:center}
.hero-main{flex:1;display:grid;place-items:center;padding:4rem 1.5rem 3rem}
.hero-band{background:var(--plum);color:var(--paper);padding:2.2rem 1.5rem 2.6rem}
.hero-band .when{margin-top:0}
.hero-band .soon{margin-top:1.6rem}
.names{font-family:var(--display);font-weight:400;line-height:.9;letter-spacing:-.02em;font-size:clamp(3.5rem,13vw,9.5rem)}
.names .amp{display:block;font-style:italic;color:var(--blush);font-size:.55em;margin:.1em 0}
.when{margin-top:2.2rem;font-size:1.2rem}
.count{margin-top:1.2rem;display:inline-flex;gap:1.6rem;font-family:var(--display);font-style:italic;font-size:1.35rem;color:var(--blush)}
.count span b{font-style:normal;font-weight:600;font-size:2rem;display:block;line-height:1;text-align:center}
.count span{text-align:center}
.soon{margin-top:2.4rem;font-family:var(--display);font-style:italic;font-size:1.25rem;color:var(--blush)}
.hero-cta{display:inline-block;margin-top:2.4rem;background:var(--pine);color:var(--paper);padding:.85rem 2rem;border-radius:999px;text-decoration:none;font-weight:600}
.hero-cta:hover{background:var(--plum)}
.hero .names,.hero .when{animation:rise 1.1s ease both}
.hero .when{animation-delay:.25s}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

/* sections */
section{padding:5rem 0}
h2{font-family:var(--display);font-weight:400;font-size:clamp(2rem,5vw,3.2rem);line-height:1.1;margin-bottom:1.6rem}
h3{font-family:var(--display);font-weight:600;font-size:1.4rem;margin-bottom:.4rem}
.story p{max-width:38rem;font-size:1.15rem}
.story p+p{margin-top:1rem}

.band{background:var(--pine);color:var(--paper)}
.band h2{color:var(--paper)}
.band a{color:var(--blush)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:3rem}
.two p+p{margin-top:.5rem}

/* schedule: a true sequence, so it gets a timeline */
.timeline{list-style:none;padding:0;border-left:2px solid var(--plum);margin-left:.4rem}
.timeline li{padding:0 0 1.6rem 1.6rem;position:relative}
.timeline li::before{content:"";position:absolute;left:-.43rem;top:.55rem;width:.75rem;height:.75rem;border-radius:50%;background:var(--plum)}
.timeline time{font-family:var(--display);font-style:italic;font-size:1.2rem;color:var(--plum);display:block}

.panel{background:var(--blush);border-radius:6px;padding:2rem}
details{border-bottom:1px solid var(--mist);padding:1rem 0}
summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:1rem}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--plum);font-size:1.4rem;line-height:1}
details[open] summary::after{content:"\2212"}
details p{margin-top:.6rem;max-width:40rem}

form{display:grid;gap:1rem;max-width:32rem}
label{font-weight:600;font-size:.95rem;display:grid;gap:.3rem}
input,select,textarea{font:inherit;color:var(--pine);background:var(--paper);border:1px solid var(--pine);border-radius:4px;padding:.7rem .8rem;width:100%}
button{font:inherit;font-weight:600;background:var(--plum);color:#fff;border:0;border-radius:999px;padding:.85rem 2rem;cursor:pointer;justify-self:start}
button:hover{background:var(--pine)}
.note{font-size:.9rem;opacity:.8}
footer{text-align:center;padding:3rem 1.5rem;font-family:var(--display);font-style:italic;font-size:1.3rem}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.hero .names,.hero .when{animation:none}}
</style>
</head>

<script>
(function(){
  var target = new Date("2028-03-24T00:00:00-05:00").getTime(); // Cancun time; adjust once the ceremony time is set
  function tick(){
    var diff = Math.max(0, target - Date.now());
    document.getElementById("d").textContent = Math.floor(diff/864e5);
    document.getElementById("h").textContent = Math.floor(diff%864e5/36e5);
    document.getElementById("m").textContent = Math.floor(diff%36e5/6e4);
  }
  tick(); setInterval(tick, 30000);
})();
</script>
